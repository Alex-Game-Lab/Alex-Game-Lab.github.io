name: Portal checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Test rendered content, authentication boundaries and offline behavior
        working-directory: client
        run: npm test
      - name: Verify checked-in bundle matches source
        working-directory: client
        run: |
          npm run build
          git diff --exit-code -- ../sites/agl/portal/assets
      - name: Build and validate GitHub Pages artifact
        run: python3 tools/build_pages.py
